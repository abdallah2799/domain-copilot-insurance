services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChangeMe_LocalDevOnly!}
    ports:
      # Host port 14330, not the default 1433 — avoids clashing with any other local SQL Server
      # instance (e.g. a different project's container) already bound to 1433 on the host.
      # Container-to-container traffic (the API's ConnectionStrings__Default) uses "mssql,1433" on the
      # compose network regardless, so this only affects connecting from the host machine itself.
      - "14330:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # FR-9's self-hosted OTel viewer (ADR-0013): a single container, no separate collector needed --
  # it accepts OTLP directly and shows traces/logs/metrics. Anonymous access is fine here since this
  # is a local dev/demo tool, never exposed beyond the compose network in a real deployment.
  # The image's own OTLP/gRPC port is 18889, not the conventional 4317 -- mapped to the
  # conventional host port here so OTEL_EXPORTER_OTLP_ENDPOINT can use the standard 4317 regardless.
  otel-collector:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # dashboard UI
      - "4317:18889" # OTLP gRPC (OTEL_EXPORTER_OTLP_ENDPOINT points here)

  # api and angular-app services are added once their Dockerfiles exist (Day 2+).

volumes:
  mssql-data:
  qdrant-storage:
  ollama-data:
